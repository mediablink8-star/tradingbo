services:
  - type: web
    name: tradingbo
    runtime: python
    plan: starter
    rootDir: outputs/trading-lab
    buildCommand: python -m compileall -q .
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: tradingbo-data
      mountPath: /data/tradingbo
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TRADINGLAB_DATA_DIR
        value: /data/tradingbo
      - key: TRADINGLAB_AUTH_REQUIRED
        value: "1"
      - key: TRADINGLAB_USERNAME
        sync: false
      - key: TRADINGLAB_PASSWORD
        sync: false
      - key: EMBER_FOREX_AUTORUN
        value: "0"
        sync: false
        sync: false
        value: "0"
        sync: false
        value: "0.1"
        value: "24"
        value: "300"
