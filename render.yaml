services:
  - type: web
    name: tradingbo
    runtime: python
    plan: free
    rootDir: outputs/trading-lab
    buildCommand: python -m compileall -q .
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TRADINGLAB_DATA_DIR
        value: /tmp/tradingbo-data
      - key: TRADINGLAB_AUTH_REQUIRED
        value: "1"
      - key: TRADINGLAB_USERNAME
        sync: false
      - key: TRADINGLAB_PASSWORD
        sync: false
      - key: EMBER_FOREX_AUTORUN
        value: "0"
      - key: JUPITER_API_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: JUPITER_AUTORUN
        sync: false
      - key: JUPITER_AUTOTRADE_TOKENS
        sync: false
      - key: JUPITER_AUTOTRADE_SOL
        value: "0.1"
      - key: JUPITER_ARM_HOURS
        value: "24"
      - key: JUPITER_CYCLE_INTERVAL
        value: "300"
