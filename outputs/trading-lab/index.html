<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember · Forex Trading Lab</title><style>body{margin:0;background:#0c1422;color:#e4ebf4;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:32px}.muted{color:#9aaec6}.panel{background:#152238;border:1px solid #2a3b53;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{font-size:25px;margin-top:5px}button,select,input{background:#0c1422;color:#fff;border:1px solid #3f5878;padding:9px;border-radius:6px;box-sizing:border-box}input{width:120px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #2a3b53}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#173c3a}.error{color:#ff9a9a}header{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><header><div><div class="muted">EMBER · AGENT TRADING LAB</div><h1>Forex Operations</h1><p class="muted">Paper FX trading with deterministic risk controls. No wallet connection. No blockchain execution.</p></div><span class="badge">PAPER ACCOUNT</span></header><section class="grid" id="stats"></section><section class="panel"><h2>FX market</h2><div class="actions"><button onclick="refresh()">Refresh rates</button><select id="pair"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>USD/CHF</option></select><select id="side"><option value="buy">Long</option><option value="sell">Short</option></select><input id="notional" type="number" min="1" max="1000" value="500"><button onclick="openPosition()">Open paper trade</button></div><table><thead><tr><th>Pair</th><th>Price</th><th>Source</th></tr></thead><tbody id="market"></tbody></table></section><section class="panel"><h2>Open positions</h2><table><thead><tr><th>Pair</th><th>Side</th><th>Notional</th><th>Entry</th><th>Unrealized P/L</th><th></th></tr></thead><tbody id="positions"></tbody></table></section><section class="panel"><h2>Risk controls</h2><div id="risk" class="muted"></div></section><p id="error" class="error"></p></main><script>async function api(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}function money(x){return Number(x||0).toFixed(2)}function render(s){const a=s.account||{};document.getElementById("stats").innerHTML=[["Equity","$"+money(a.equity)],["Cash","$"+money(a.cash)],["Realized P/L","$"+money(a.realized_pnl)],["Exposure","$"+money(a.exposure)]].map(x=>'<div class="panel"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join("");document.getElementById("market").innerHTML=Object.values((s.market||{}).pairs||{}).map(x=>'<tr><td>'+x.pair+'</td><td>'+Number(x.price).toFixed(6)+'</td><td>'+x.source+'</td></tr>').join("");document.getElementById("positions").innerHTML=(a.positions||[]).map(p=>'<tr><td>'+p.pair+'</td><td>'+p.side+'</td><td>$'+money(p.notional)+'</td><td>'+Number(p.entry_price).toFixed(6)+'</td><td>$'+money(p.unrealized_pnl)+'</td><td><button onclick="closePosition(\''+p.id+'\')">Close</button></td></tr>').join("")||'<tr><td colspan="6" class="muted">No open positions.</td></tr>';const r=s.risk||{};document.getElementById("risk").textContent='Max trade $'+r.max_trade_notional+' · Max exposure $'+r.max_exposure+' · Max positions '+r.max_positions+' · Daily loss limit $'+r.max_daily_loss+' · Stop '+(r.stop_loss_pct*100)+'% · Take profit '+(r.take_profit_pct*100)+'% · Leverage '+r.max_leverage+'x'}async function refresh(){try{document.getElementById("error").textContent="";render(await api("/api/forex"))}catch(e){document.getElementById("error").textContent=e.message}}async function openPosition(){try{render((await api("/api/forex/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pair:document.getElementById("pair").value,side:document.getElementById("side").value,notional:Number(document.getElementById("notional").value)})})).status)}catch(e){document.getElementById("error").textContent=e.message}}async function closePosition(id){try{render((await api("/api/forex/close",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})).status)}catch(e){document.getElementById("error").textContent=e.message}}refresh();setInterval(refresh,60000)</script></body></html>
