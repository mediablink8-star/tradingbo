<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingLab · Floor Plan</title>
<style>
/* Console shell — deliberately identical to index.html so the two views read
   as one product. Only the floor canvas differs. */
:root{
  --bg:#080a0d; --surface:#0e1218; --surface-2:#12171f; --surface-3:#171d26;
  --line:#1d242e; --line-2:#2a323e;
  --ink:#e4ebf2; --ink-2:#aeb9c6; --dim:#78838f; --faint:#4d565f;
  --up:#2fbf87; --down:#e2555f; --warn:#d9a441; --accent:#4c8dff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:6px; --r-lg:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:#4c8dff44}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface);
  position:sticky;top:0;z-index:20}
.bar .path{font:500 12px/1 var(--mono);color:var(--dim)}
.bar .path b{color:var(--ink);font-weight:600}
.bar .bt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:600 9.5px/1 var(--mono);letter-spacing:.13em;padding:5px 8px;border-radius:4px;
  border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.ok{border-color:#2fbf8755;color:#7fd8b4;background:#12301f}
.tag.warn{border-color:#d9a44155;color:#e8c583;background:#2e2413}
.tag.bad{border-color:#e2555f55;color:#f0939a;background:#31161a}
.btn{border:1px solid var(--line-2);background:var(--surface-3);border-radius:var(--r);
  padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;
  transition:background .12s,border-color .12s}
.btn:hover{background:#1d242e;border-color:#3a4453}
.btn.go{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:700}
.btn.go:hover{background:#6ba1ff}
.btn:disabled{opacity:.55;cursor:not-allowed}

.wrap{padding:18px;display:grid;gap:16px;max-width:1720px}
.note{padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);font:400 11px/1.6 var(--mono);color:var(--dim)}
.note:empty{display:none}

.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.sec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.sechd h2{margin:0;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.sechd .sub{font:500 10px/1 var(--mono);letter-spacing:.09em;color:var(--faint)}
.secbd{padding:14px}

/* Floor canvas */
.stage{background:#0a0e13;position:relative}
#office{display:block;width:100%;height:auto;aspect-ratio:960/540}
.floorfoot{padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);
  font:400 10.5px/1.6 var(--mono);color:var(--dim)}

/* Inspector */
.who{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.who .ix{font:700 10px/1 var(--mono);color:var(--faint);letter-spacing:.1em}
.who .nm{font-size:14px;font-weight:650}
.st{font:600 9px/1 var(--mono);letter-spacing:.13em;margin:9px 0}
.st.live{color:var(--up)} .st.idle{color:var(--warn)} .st.off{color:var(--faint)}
.detail{font-size:12px;line-height:1.6;color:var(--ink-2)}
.kv{display:grid;gap:1px;background:var(--line);margin-top:13px;border:1px solid var(--line);border-radius:var(--r)}
.kv div{background:var(--surface);padding:8px 11px;display:flex;justify-content:space-between;gap:10px}
.kv b{font:500 9.5px/1.4 var(--mono);letter-spacing:.12em;color:var(--faint);font-weight:600}
.kv span{font:600 11.5px/1.4 var(--mono);color:var(--ink);text-align:right}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.roster button{background:var(--surface);border:0;border-radius:0;padding:10px 12px;
  text-align:left;cursor:pointer;font-size:12px;color:var(--ink-2);
  display:grid;gap:5px;transition:background .12s,color .12s}
.roster button:hover{background:var(--surface-2);color:var(--ink)}
.roster button[aria-pressed="true"]{background:#14213a;color:var(--ink)}
.roster button .r{font:600 9px/1 var(--mono);letter-spacing:.12em;color:var(--faint)}
.roster button .s{font:600 9px/1 var(--mono);letter-spacing:.1em}
.riskbox{border-top:1px solid var(--line);padding:11px 13px;
  font:400 10.5px/1.7 var(--mono);color:var(--dim)}
.riskbox.halt{border-top-color:#e2555f55;color:#f0939a;background:#1a0e10}

.log{display:grid;max-height:300px;overflow-y:auto}
.log .row{display:grid;grid-template-columns:7px minmax(0,1fr);gap:9px;
  padding:9px 13px;border-bottom:1px solid var(--line);align-items:start}
.log .row:last-child{border-bottom:0}
.log .tx{font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.log .tx b{color:var(--ink);font-weight:600}
.empty{padding:20px 13px;text-align:center;font:400 11.5px/1.6 var(--mono);color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:5px;flex:none}
.dot.ok{background:var(--up)} .dot.warn{background:var(--warn)}

@media(max-width:1100px){.split{grid-template-columns:1fr}}
@media(max-width:640px){.wrap{padding:12px}.bar{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="path">TradingLab / <b>Floor Plan</b></div>
  <div class="bt">
    <span class="tag" id="modeTag">CONNECTING</span>
    <button class="btn" onclick="location.href='index.html'">&#8592; Overview</button>
    <button class="btn" id="cycle">Run agent cycle</button>
    <button class="btn" id="pauseBtn">Pause</button>
  </div>
</div>

<div class="wrap">
  <div class="note" id="notice"></div>

  <div class="split">
    <div style="display:grid;gap:16px;min-width:0">
      <section class="sec">
        <div class="sechd">
          <h2>Floor Plan</h2>
          <span class="sub" id="stageMeta">—</span>
        </div>
        <div class="stage"><canvas id="office" width="960" height="540"
          aria-label="Schematic floor plan of six agent stations and a supervisor"></canvas></div>
        <div class="floorfoot" id="floorFoot">Loading floor state…</div>
      </section>

      <section class="sec">
        <div class="sechd"><h2>Activity</h2><span class="sub">RECORDED REPORTS</span></div>
        <div class="log" id="log"></div>
      </section>
    </div>

    <div style="display:grid;gap:16px;min-width:0">
      <section class="sec">
        <div class="sechd"><h2>Inspector</h2></div>
        <div class="secbd">
          <div class="who"><span class="ix" id="selIx">01</span><span class="nm" id="selName">—</span></div>
          <div class="st off" id="selState">NO DATA</div>
          <div class="detail" id="selText">Select a station on the plan or in the roster.</div>
          <div class="kv">
            <div><b>ROLE</b><span id="selRole">—</span></div>
            <div><b>STATE</b><span id="selAct">—</span></div>
            <div><b>REPORTS</b><span id="selCount">0</span></div>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="sechd"><h2>Stations</h2></div>
        <div class="roster" id="roster"></div>
      </section>

      <section class="sec">
        <div class="sechd"><h2>Account &amp; Risk</h2><span class="sub" id="acctState">—</span></div>
        <div class="kv" id="acct"></div>
        <div class="riskbox" id="riskBox">Loading risk parameters…</div>
      </section>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('office'),ctx=canvas.getContext('2d');
const W=960,H=540;

/* Stations: fixed plan positions, in canvas units. */
const ROLES=[
  {ix:'01',name:'Market Researcher', role:'Feeds and data quality', x:160,y:196, hue:'#4c8dff'},
  {ix:'02',name:'Macro Analyst',     role:'Regime and context',    x:480,y:196, hue:'#7c6cff'},
  {ix:'03',name:'Strategy Analyst',  role:'Signal construction',   x:800,y:196, hue:'#00a3c4'},
  {ix:'04',name:'Risk Critic',       role:'Veto authority',        x:160,y:356, hue:'#d9a441'},
  {ix:'05',name:'Portfolio Coord.',  role:'Allocation',            x:480,y:356, hue:'#2fbf87'},
  {ix:'06',name:'Supervisor',       role:'Deterministic oversight',x:800,y:356,hue:'#8fa3b8'}
];
const STATE={WORK:{t:'WORKING',c:'#2fbf87'},MOVE:{t:'IN TRANSIT',c:'#4c8dff'},
             IDLE:{t:'STANDBY',c:'#4d565f'},REPORT:{t:'REPORTING',c:'#d9a441'}};

let live=null,sel=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0=performance.now(),logRows=[],counted={};
ROLES.forEach((_,i)=>counted[i]=0);

const match=role=>{
  if(!live)return null;
  const key=role.name.split(' ')[0].toLowerCase();
  if(role.ix==='06')return live.brief||null;
  return (live.events||[]).find(e=>String(e.agent||'').toLowerCase().includes(key))||null;
};

function seed(){
  live={events:[]};logRows=[];counted={};ROLES.forEach((_,i)=>counted[i]=0);paint();
}

/* ── canvas helpers ────────────────────────────────────── */
const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const box=(x,y,w,h,c,r=4)=>{ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()};
const line=(x,y,x2,y2,c,w=1)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
  ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()};
const txt=(v,x,y,c='#78838f',s=10,a='left')=>{ctx.fillStyle=c;ctx.font=(s>=12?'600 ':'500 ')+s+'px ui-monospace,Menlo,monospace';
  ctx.textAlign=a;ctx.fillText(v,x,y)};
const circle=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()};

/* ── schematic agent marker ─────────────────────────────── */
function marker(role,x,y,st,active,moving){
  const hue=role.hue;
  // selection / activity footprint
  if(active){
    ctx.strokeStyle=hue;ctx.lineWidth=1;ctx.globalAlpha=.45;
    ctx.beginPath();ctx.arc(x,y+16,20,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
  // schematic figure: head + shoulders, drawn as flat geometry
  circle(x,y-6,6.5,'#1b2430');
  ctx.strokeStyle=hue;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y-6,6.5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=hue;ctx.beginPath();
  ctx.moveTo(x-11,y+16);ctx.quadraticCurveTo(x,y+1,x+11,y+16);ctx.closePath();ctx.fill();
  if(active)circle(x,y-6,2,hue);
  // status lamp
  circle(x+13,y-13,2.6,st.c);
  if(moving){
    ctx.strokeStyle=st.c;ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.ellipse(x,y+17,10,3,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  }
}

/* ── floor plan ────────────────────────────────────────── */
function paint(){
  const now=(performance.now()-t0)/1000;
  ctx.clearRect(0,0,W,H);
  rect(0,0,W,H,'#0a0e13');

  // grid
  ctx.strokeStyle='#12181f';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke()}
  for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}

  // header band
  rect(0,0,W,52,'#0d1218');line(0,52.5,W,52.5,'#1d242e');
  txt('FLOOR PLAN',18,32,'#e4ebf2',13);
  txt('AGENT STATION SCHEMATIC',18,45,'#4d565f',9);
  if(live){
    txt('CASH  $'+Number(live.equity||0).toFixed(2),W-190,26,'#e4ebf2',12,'right');
    txt(live.open+' OPEN  ·  '+(live.halted?'HALTED':'ARMED'),W-190,42,
      live.halted?'#e2555f':'#2fbf87',9,'right');
  }

  // three zone bands
  const zones=[[16,'ZONE A · FEEDS'],[336,'ZONE B · ANALYSIS'],[656,'ZONE C · EXECUTION']];
  zones.forEach(([x,label])=>{
    box(x,62,288,404,'#0d1218',6);
    ctx.strokeStyle='#1a212a';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,62,288,404,6);ctx.stroke();
    txt(label,x+12,82,'#4d565f',9);
  });

  // desk for each station
  ROLES.forEach((r,i)=>{
    const hit=match(r);
    const active=Boolean(hit);
    const moving=!active&&!paused&&((now*0.14+i*0.31)%1)<0.34;
    const st=active?STATE.REPORT:moving?STATE.MOVE:STATE.IDLE;
    const bob=moving?Math.sin(now*7+i)*1.6:0;
    const dx=moving?Math.sin(now*0.8+i)*10:0;
    const deskY=r.y-40;

    // desk slab
    box(r.x-62,deskY,124,52,'#141a22',5);
    ctx.strokeStyle=active?r.hue:'#232c37';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(r.x-62,deskY,124,52,5);ctx.stroke();
    rect(r.x-62,deskY,124,1,active?r.hue:'#232c37');
    // monitor
    box(r.x-46,deskY+8,42,26,'#080c11',3);
    ctx.strokeStyle='#212a34';ctx.beginPath();ctx.roundRect(r.x-46,deskY+8,42,26,3);ctx.stroke();
    if(active){
      rect(r.x-42,deskY+14,34,1,r.hue);rect(r.x-42,deskY+19,24,1,r.hue);
    }
    // terminal block
    box(r.x+6,deskY+16,26,14,'#0b1017',3);
    txt(r.ix,r.x+19,deskY+27,'#3d4650',9,'center');

    // figure stands clear in front of the desk, never overlapping it
    marker(r,r.x+dx,deskY+88+bob,st,active,moving);
    txt(r.name.toUpperCase(),r.x,deskY+124,active?'#aeb9c6':'#5b6570',9,'center');
    txt(st.t,r.x,deskY+138,st.c,8,'center');

    if(sel===i){
      ctx.strokeStyle=r.hue;ctx.lineWidth=1.5;
      ctx.strokeRect(r.x-72,deskY-48,144,196);
      for(const [cx,cy,sx,sy] of [[-72,-48,1,1],[72,-48,-1,1],[-72,148,1,-1],[72,148,-1,-1]]){
        line(r.x+cx,deskY+cy,r.x+cx+sx*13,deskY+cy,r.hue,2);
        line(r.x+cx,deskY+cy,r.x+cx,deskY+cy+sy*13,r.hue,2);
      }
    }
  });

  // legend
  rect(16,482,928,32,'#0d1218');
  txt('LEGEND',28,502,'#4d565f',9);
  let lx=110;
  [[STATE.REPORT,'REPORTING'],[STATE.MOVE,'IN TRANSIT'],[STATE.IDLE,'STANDBY']].forEach(([s,l])=>{
    circle(lx,498,3,s.c);txt(l,lx+9,502,'#5b6570',9);lx+=96;
  });
  txt('PLAN VIEW IS ILLUSTRATIVE · RECORDED REPORTS ARE THE SOURCE OF TRUTH',
      W-18,502,'#3d4650',9,'right');
  txt('T+'+String(Math.floor(now)).padStart(3,'0')+'s',W-18,522,'#3d4650',9,'right');
}

/* ── readouts ──────────────────────────────────────────── */
function paintInspector(){
  const r=ROLES[sel],hit=match(r);
  $('selIx').textContent=r.ix;
  $('selName').textContent=r.name;
  $('selRole').textContent=r.role;
  const st=hit?STATE.REPORT:STATE.IDLE;
  $('selState').textContent=st.t;
  $('selState').className='st '+(hit?'live':'off');
  $('selText').textContent=hit?.summary||'No report recorded for this station yet.';
  $('selAct').textContent=hit?'REPORTING':'STANDBY';
  $('selCount').textContent=String(counted[sel]||0);
}

function paintRoster(){
  $('roster').innerHTML=ROLES.map((r,i)=>{
    const hit=match(r);
    return '<button aria-pressed="'+(i===sel)+'" onclick="pick('+i+')">'+
      '<span class="r">'+r.ix+' · '+r.name+'</span>'+
      '<span class="s" style="color:'+(hit?'#2fbf87':'#4d565f')+'">'+
      (hit?'REPORT RECEIVED':'NO REPORT')+'</span></button>';
  }).join('');
}

function paintLog(){
  if(!logRows.length){
    $('log').innerHTML='<div class="empty">No recorded activity yet.<br>'+
      'Run an agent cycle to produce reports.</div>';
    return;
  }
  $('log').innerHTML=logRows.slice(0,40).map(l=>
    '<div class="row"><i class="dot '+(l.ok?'ok':'warn')+'"></i>'+
    '<div class="tx"><b>'+l.a+'</b><br>'+l.s+'</div></div>').join('');
}

function paintShell(){
  if(!live)return;
  $('modeTag').textContent=live.halted?'RISK HALT':live.auto?'AUTO CYCLES':'MANUAL CYCLES';
  $('modeTag').className='tag '+(live.halted?'bad':live.auto?'ok':'warn');
  $('floorFoot').textContent='Equity $'+Number(live.equity||0).toFixed(2)+
    '  ·  exposure $'+Number(live.exposure||0).toFixed(2)+
    '  ·  '+live.open+' open  ·  '+live.reports+' recorded report(s)  ·  '+
    (live.stale?'feed stale':'feed current');
  $('stageMeta').textContent=live.prices+' price rows  ·  '+live.date;
  $('acctState').textContent=live.halted?'HALTED':'ARMED';
  $('acctState').style.color=live.halted?'#e2555f':'#2fbf87';
  const r=live.risk||{};
  const row=(k,v)=>'<div><b>'+k+'</b><span>'+v+'</span></div>';
  $('acct').innerHTML=
    row('EQUITY','$'+Number(live.equity||0).toFixed(2))+
    row('EXPOSURE','$'+Number(live.exposure||0).toFixed(2))+
    row('OPEN POSITIONS',String(live.open)+' / '+(r.max_positions??'—'))+
    row('REALISED P/L','$'+Number(live.realized??0).toFixed(2))+
    row('RISK GATE',live.halted?'HALTED':'ARMED');
  $('riskBox').className='riskbox'+(live.halted?' halt':'');
  $('riskBox').textContent='max trade $'+Number(r.max_trade_notional??0).toFixed(0)+
    '  ·  max exposure $'+Number(r.max_exposure??0).toFixed(0)+
    '  ·  daily loss $'+Number(r.max_daily_loss??0).toFixed(0)+
    '  ·  SL '+Number((r.stop_loss_pct||0)*100).toFixed(1)+'%'+
    '  ·  TP '+Number((r.take_profit_pct||0)*100).toFixed(1)+'%'+
    '  ·  leverage '+(r.max_leverage??'—')+'x';
  $('notice').textContent=live.prices
    ? ''
    : 'No price rows returned by the provider. The plan still renders, but no report can be produced.';
}

/* ── data ──────────────────────────────────────────────── */
async function poll(){
  if(window.parent!==window)return;
  try{
    const [fx,ag]=await Promise.all([
      fetch('/api/forex',{cache:'no-store'}).then(r=>r.json()),
      fetch('/api/forex/agents',{cache:'no-store'}).then(r=>r.json())
    ]);
    const acc=fx.account||{},pairs=fx.market?.pairs||{};
    const rows=Object.values(pairs).filter(q=>q&&Number.isFinite(q.price)&&q.price>0).length;
    const events=ag.events||[];

    if(events.length!==logRows.length){
      const seen=new Set(logRows.map(l=>l.k));
      events.filter(e=>e.agent).forEach(e=>{
        const k=e.agent+e.timestamp+e.step;
        if(seen.has(k))return;
        logRows.unshift({k,a:e.agent,s:e.summary||'Recorded event.',ok:true});
        const i=ROLES.findIndex(r=>r.name.split(' ')[0].toLowerCase()===String(e.agent).split(' ')[0].toLowerCase());
        if(i>=0)counted[i]++;
      });
      paintLog();
    }

    live={
      events,
      equity:acc.equity??0,
      exposure:acc.exposure??0,
      realized:acc.realized_pnl??0,
      risk:fx.risk||{},
      open:(acc.positions||[]).length,
      halted:Boolean(acc.daily_halted),
      auto:Boolean(ag.auto_run_enabled),
      prices:rows,
      date:fx.market?.provider_date||'—',
      reports:events.filter(e=>e.agent).length,
      stale:false,
      brief:'Deterministic supervisor. Has no trading authority and makes no model calls.'
    };
    paintShell();paintRoster();paintInspector();paint();
  }catch(e){
    if(live)live.stale=true;
    $('modeTag').textContent='DISCONNECTED';
    $('modeTag').className='tag bad';
    $('notice').textContent='Server unreachable: '+e.message;
  }
}

function pick(i){sel=i;paintInspector();paintRoster();paint()}

$('cycle').addEventListener('click',async()=>{
  const b=$('cycle');b.disabled=true;b.textContent='Running…';
  try{
    const r=await fetch('/api/forex/agents/run',{method:'POST',
      headers:{'Content-Type':'application/json'},body:'{}'});
    const d=await r.json();
    if(!r.ok)throw Error(d.error||'Cycle failed');
    $('notice').textContent='Cycle complete — '+(d.events||[]).length+
      ' recorded report(s), '+(d.executed||[]).length+' paper entr(ies).';
    await poll();
  }catch(e){$('notice').textContent='Cycle error: '+e.message}
  finally{b.disabled=false;b.textContent='Run agent cycle'}
});

$('pauseBtn').addEventListener('click',()=>{
  paused=!paused;
  $('pauseBtn').textContent=paused?'Resume':'Pause';
});

ROLES.forEach((_,i)=>{
  const b=document.createElement('button');
  b.textContent=ROLES[i].name;b.onclick=()=>pick(i);
  $('roster').appendChild(b);
});

canvas.addEventListener('click',ev=>{
  const b=canvas.getBoundingClientRect();
  const x=(ev.clientX-b.left)*W/b.width,y=(ev.clientY-b.top)*H/b.height;
  let best=-1,bd=1e9;
  ROLES.forEach((r,i)=>{const d=Math.hypot(x-r.x,y-(r.y+48));if(d<bd){bd=d;best=i}});
  if(bd<100)pick(best);
});

seed();
poll();
setInterval(poll,10000);
(function loop(){paint();requestAnimationFrame(loop)})();
</script>
</body>
</html>
