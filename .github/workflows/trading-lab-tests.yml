name: trading-lab-tests
on:
  push:
    branches: [main, secure-autonomous-execution]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trading-lab unit tests
        run: |
          python -m unittest             outputs/trading-lab/test_live_control.py             outputs/trading-lab/test_shadow_execution.py             outputs/trading-lab/test_autonomous_execution.py
