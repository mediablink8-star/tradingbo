name: trading-lab-tests
on:
  push:
    branches: [main, secure-autonomous-execution]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trading-lab unit tests
        working-directory: outputs/trading-lab
        run: |
          python -m unittest \
            test_live_control.py \
            test_shadow_execution.py \
            test_autonomous_execution.py \
            test_signing_policy.py \
            test_transaction_policy.py
